<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>NovaCore Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Importante: la CSP por defecto bloquea fetch a webs externas e imágenes remotas.
         Aquí permitimos solo las dos APIs que usa el proyecto. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://fakestoreapi.com; connect-src 'self' https://jsonplaceholder.typicode.com https://fakestoreapi.com"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
